[package]
name = "hoard-api3-lockgen"
version = "0.8.0-dev.1"
edition = "2024"
publish = false

[dependencies]
stable-app-core = { git = "https://github.com/diedemus/stable-build-framework.git", tag = "v0.5.0" }
stable-ui = { git = "https://github.com/diedemus/stable-build-framework.git", tag = "v0.5.0" }
anyhow = "=1.0.104"
ashpd = { version = "=0.13.13", default-features = false, features = ["tokio", "open_uri"] }
chrono = { version = "=0.4.45", default-features = false, features = ["clock"] }
dirs = "=7.0.0"
filetime = "=0.2.29"
egui = { version = "=0.36.2", default-features = false, features = ["default_fonts"] }
egui-wgpu = { version = "=0.36.2", default-features = false }
raw-window-handle = "=0.6.2"
pollster = "=1.0.1"
smithay-client-toolkit = { version = "=0.21.1", default-features = false, features = ["calloop", "xkbcommon", "system"] }
wgpu = { version = "=30.0.1", default-features = false, features = ["std", "vulkan", "wgsl"] }
nix = { version = "=0.31.3", features = ["fs"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["blocking", "json", "rustls"] }
semver = "=1.0.28"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.11.0"
tar = "=0.4.46"
tempfile = "=3.27.0"
toml = "=1.1.6+spec-1.1.0"
tokio = { version = "=1.53.1", features = ["rt", "net", "time"] }
zstd = "=0.14.0"
image = { version = "=0.25.10", default-features = false, features = ["bmp", "gif", "jpeg", "png", "tiff", "webp"] }
percent-encoding = "=2.3.2"
walkdir = "=2.5.0"
url = "=2.5.8"
