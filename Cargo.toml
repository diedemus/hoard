[workspace]
members = ["crates/hoard-core", "crates/hoard-function", "apps/hoard"]
resolver = "3"

[workspace.package]
version = "0.8.0-dev.1"
edition = "2024"
license = "MIT"

[workspace.dependencies]
stable-app-core = { git = "https://github.com/diedemus/stable-build-framework.git", tag = "v0.5.3" }
stable-ui = { git = "https://github.com/diedemus/stable-build-framework.git", tag = "v0.5.3" }
anyhow = "*"
ashpd = { version = "*", default-features = false, features = ["tokio", "open_uri"] }
chrono = { version = "*", default-features = false, features = ["clock"] }
dirs = "*"
filetime = "*"
egui = { version = "*", default-features = false, features = ["default_fonts"] }
egui-wgpu = { version = "*", default-features = false }
raw-window-handle = "*"
pollster = "*"
smithay-client-toolkit = { version = "*", default-features = false, features = ["calloop", "xkbcommon", "system"] }
wgpu = { version = "*", default-features = false, features = ["std", "vulkan", "wgsl"] }
nix = { version = "*", features = ["fs"] }
reqwest = { version = "*", default-features = false, features = ["blocking", "json", "rustls"] }
semver = "*"
serde = { version = "*", features = ["derive"] }
serde_json = "*"
sha2 = "*"
tar = "*"
tempfile = "*"
toml = "*"
tokio = { version = "*", features = ["rt", "net", "time"] }
zstd = "*"
image = { version = "*", default-features = false, features = ["bmp", "gif", "jpeg", "png", "tiff", "webp"] }
percent-encoding = "*"
walkdir = "*"
url = "*"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
opt-level = 3
