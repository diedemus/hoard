[package]
name = "hoard"
version = "0.8.0-dev.7"
edition = "2021"
description = "A Wayland-first, deeply themeable Rust file manager"
license = "MIT"

[dependencies]
anyhow = "1.0"
ashpd = { version = "0.13", default-features = false, features = ["tokio", "open_uri"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
dirs = "6.0"
eframe = { version = "0.30", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui = "0.30"
nix = { version = "0.29", features = ["fs"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
semver = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tar = "0.4"
tempfile = "3.13"
toml = "0.8"
tokio = { version = "1.43", features = ["rt", "net", "time"] }
zstd = "0.13"

image = { version = "0.25", default-features = false, features = ["bmp", "gif", "jpeg", "png", "tiff", "webp"] }

percent-encoding = "2.3"

walkdir = "2.5"
url = "2.5"
winit = { version = "0.30", default-features = false, features = ["x11", "wayland"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
opt-level = 3
